<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">A graph can be right and still be old</title>
  <desc id="desc">An index built when a helper had four direct callers remains at four after source changes to five callers. Compare the indexed revision to current source, then refresh before relying on it.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#A9DDE7"/></marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 62px; font-weight: 700; fill: #F0EDE4; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 400; fill: #B7C8D2; }
      .card-title { font-family: Arial, Helvetica, sans-serif; font-size: 38px; font-weight: 700; fill: #F0EDE4; }
      .card-body { font-family: Arial, Helvetica, sans-serif; font-size: 29px; font-weight: 400; fill: #B7C8D2; }
      .metric { font-family: Arial, Helvetica, sans-serif; font-size: 68px; font-weight: 700; fill: #F0EDE4; }
      .metric-small { font-family: Arial, Helvetica, sans-serif; font-size: 42px; font-weight: 700; fill: #F0EDE4; }
      .note { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #F0EDE4; }
      .small-note { font-family: Arial, Helvetica, sans-serif; font-size: 27px; font-weight: 400; fill: #B7C8D2; }
      .box { stroke-width: 3; }
      .arrow { fill: none; stroke: #A9DDE7; stroke-width: 4; marker-end: url(#arrow); }
      .rule { stroke: #577581; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1600" height="640" fill="#08131E"/>
  <text x="80" y="78" class="title" text-anchor="start"><tspan x="80">A graph can be right and still be old</tspan></text>
  <text x="80" y="122" class="subtitle" text-anchor="start"><tspan x="80">The source changed. The old index still reports yesterday’s caller set.</tspan></text>
  <rect x="65" y="225" width="330" height="210" rx="18" fill="#102D3A" stroke="#A9DDE7" class="box"/>
  <text x="230" y="300" class="card-title" text-anchor="middle"><tspan x="230">Index built</tspan></text>
  <text x="230" y="360" class="metric-small" text-anchor="middle"><tspan x="230">4 callers</tspan></text>
  <path d="M395 330 H455" class="arrow"/>
  <rect x="455" y="225" width="330" height="210" rx="18" fill="#332B1D" stroke="#F3C969" class="box"/>
  <text x="620" y="300" class="card-title" text-anchor="middle"><tspan x="620">Source changes</tspan></text>
  <text x="620" y="360" class="metric-small" text-anchor="middle"><tspan x="620">5 callers</tspan></text>
  <path d="M785 330 H845" class="arrow"/>
  <rect x="845" y="225" width="330" height="210" rx="18" fill="#332126" stroke="#F26B5B" class="box"/>
  <text x="1010" y="300" class="card-title" text-anchor="middle"><tspan x="1010">Old graph</tspan></text>
  <text x="1010" y="360" class="metric-small" text-anchor="middle"><tspan x="1010">4, misses 1</tspan></text>
  <path d="M1175 330 H1235" class="arrow"/>
  <rect x="1235" y="225" width="300" height="210" rx="18" fill="#153329" stroke="#62D2C3" class="box"/>
  <text x="1385" y="300" class="card-title" text-anchor="middle"><tspan x="1385">Compare</tspan></text>
  <text x="1385" y="360" class="metric-small" text-anchor="middle"><tspan x="1385">+ refresh</tspan></text>
  <rect x="65" y="505" width="1470" height="88" rx="16" fill="#213039" stroke="#A9DDE7" class="box"/>
  <text x="800" y="561" class="note" text-anchor="middle"><tspan x="800">A compact answer is current only when its revision still matches source.</tspan></text>
</svg>
