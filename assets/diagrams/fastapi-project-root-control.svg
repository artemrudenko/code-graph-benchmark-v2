<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">FastAPI project-root control</title>
  <desc id="desc">The same FastAPI commit and same solve_dependencies lookup returned one of four reference sites from a nested package root, and all four from the repository root.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1525"/>
      <stop offset="1" stop-color="#07101d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000814" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="15" markerHeight="15" refX="12" refY="7.5" orient="auto">
      <path d="M0,0 L15,7.5 L0,15 Z" fill="#92a4be"/>
    </marker>
    <style>
      .title { font: 700 54px Inter, Arial, sans-serif; fill: #f7f8fb; letter-spacing: -1.2px; }
      .subtitle { font: 400 26px Inter, Arial, sans-serif; fill: #b9c5d5; }
      .card-title { font: 650 34px Inter, Arial, sans-serif; fill: #f7f8fb; }
      .card-code { font: 500 28px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #d7e2f0; }
      .card-note { font: 400 25px Inter, Arial, sans-serif; fill: #bdc9d8; }
      .number { font: 750 82px Inter, Arial, sans-serif; fill: #f7f8fb; letter-spacing: -3px; }
      .number-note { font: 500 26px Inter, Arial, sans-serif; fill: #d7e2f0; }
      .arrow-label { font: 600 23px Inter, Arial, sans-serif; fill: #c7d2e1; }
      .footer { font: 650 34px Inter, Arial, sans-serif; fill: #f7f8fb; }
      .footer-note { font: 400 24px Inter, Arial, sans-serif; fill: #b9c5d5; }
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)" rx="32"/>
  <text class="title" x="600" y="75" text-anchor="middle">FastAPI: index scope changed the reference answer</text>
  <text class="subtitle" x="600" y="114" text-anchor="middle">Same pinned commit · same symbol: solve_dependencies · only the project root changed</text>

  <g filter="url(#shadow)">
    <rect x="68" y="180" width="443" height="278" rx="24" fill="#301f2c" stroke="#d9767a" stroke-width="3"/>
    <rect x="689" y="180" width="443" height="278" rx="24" fill="#13352c" stroke="#6bd19c" stroke-width="3"/>
  </g>

  <text class="card-title" x="289" y="239" text-anchor="middle">Nested package root</text>
  <text class="card-code" x="289" y="272" text-anchor="middle">fastapi/</text>
  <line x1="128" y1="308" x2="450" y2="308" stroke="#77505e" stroke-width="2"/>
  <text class="number" x="289" y="379" text-anchor="middle">1 / 4</text>
  <text class="number-note" x="289" y="414" text-anchor="middle">reference sites found</text>

  <text class="card-title" x="911" y="239" text-anchor="middle">Repository root</text>
  <text class="card-code" x="911" y="272" text-anchor="middle">.</text>
  <line x1="750" y1="308" x2="1072" y2="308" stroke="#4e8a70" stroke-width="2"/>
  <text class="number" x="911" y="379" text-anchor="middle">4 / 4</text>
  <text class="number-note" x="911" y="414" text-anchor="middle">reference sites found</text>

  <path d="M528 354 H672" stroke="#92a4be" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <rect x="518" y="288" width="164" height="44" rx="22" fill="#17253a" stroke="#536987" stroke-width="2"/>
  <text class="arrow-label" x="600" y="316" text-anchor="middle">only root changed</text>

  <rect x="146" y="525" width="908" height="90" rx="24" fill="#162237" stroke="#536987" stroke-width="3"/>
  <text class="footer" x="600" y="566" text-anchor="middle">Rule: project setup is part of the answer.</text>
  <text class="footer-note" x="600" y="598" text-anchor="middle">Check the actual repository root before trusting a reference count.</text>
</svg>
