<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="710" viewBox="0 0 1600 710" role="img" aria-labelledby="title desc">
  <title id="title">The hard cross-layer task stayed hard</title>
  <desc id="desc">Two contained changes passed all five sessions in every condition. The cross-layer contract passed one of five with source navigation and Code Review Graph, and zero of five with Serena.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#A9DDE7"/></marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 62px; font-weight: 700; fill: #F0EDE4; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 400; fill: #B7C8D2; }
      .card-title { font-family: Arial, Helvetica, sans-serif; font-size: 38px; font-weight: 700; fill: #F0EDE4; }
      .card-body { font-family: Arial, Helvetica, sans-serif; font-size: 29px; font-weight: 400; fill: #B7C8D2; }
      .metric { font-family: Arial, Helvetica, sans-serif; font-size: 68px; font-weight: 700; fill: #F0EDE4; }
      .metric-small { font-family: Arial, Helvetica, sans-serif; font-size: 42px; font-weight: 700; fill: #F0EDE4; }
      .note { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #F0EDE4; }
      .small-note { font-family: Arial, Helvetica, sans-serif; font-size: 27px; font-weight: 400; fill: #B7C8D2; }
      .box { stroke-width: 3; }
      .arrow { fill: none; stroke: #A9DDE7; stroke-width: 4; marker-end: url(#arrow); }
      .rule { stroke: #577581; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1600" height="710" fill="#08131E"/>
  <text x="80" y="78" class="title" text-anchor="start"><tspan x="80">The hard cross-layer task stayed hard</tspan></text>
  <text x="80" y="122" class="subtitle" text-anchor="start"><tspan x="80">Three tasks, three conditions, five fresh sessions per condition.</tspan></text>
  <rect x="80" y="205" width="700" height="300" rx="18" fill="#102D3A" stroke="#62D2C3" class="box"/>
  <text x="125" y="275" class="card-title" text-anchor="start"><tspan x="125">Contained work</tspan></text>
  <text x="125" y="322" class="card-body" text-anchor="start"><tspan x="125">2 tasks × 3 conditions</tspan></text>
  <text x="125" y="418" class="metric" text-anchor="start"><tspan x="125">all 5 / 5</tspan></text>
  <text x="125" y="462" class="card-body" text-anchor="start"><tspan x="125">No correctness advantage from an index.</tspan></text>
  <rect x="820" y="205" width="700" height="300" rx="18" fill="#332126" stroke="#F26B5B" class="box"/>
  <text x="865" y="275" class="card-title" text-anchor="start"><tspan x="865">Cross-layer contract</tspan></text>
  <text x="865" y="322" class="card-body" text-anchor="start"><tspan x="865">SQL → pagination → TypeScript → two surfaces</tspan></text>
  <text x="865" y="385" class="card-body" text-anchor="start"><tspan x="865">Source navigation  1 / 5</tspan></text>
  <text x="865" y="425" class="card-body" text-anchor="start"><tspan x="865">Code Review Graph  1 / 5</tspan></text>
  <text x="865" y="465" class="card-body" text-anchor="start"><tspan x="865">Serena  0 / 5</tspan></text>
  <rect x="80" y="560" width="1440" height="94" rx="16" fill="#332B1D" stroke="#F3C969" class="box"/>
  <text x="800" y="618" class="note" text-anchor="middle"><tspan x="800">An index preserved easy changes, not reliability for the hard task.</tspan></text>
</svg>
