<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Four checks before trusting compact code context</title>
  <desc id="desc">Check the exact symbol, scope, caller type, and whether matching is exact before acting on compact code context.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#04101A" flood-opacity=".25"/></filter></defs>
  <rect width="1600" height="900" fill="#08131E"/>
  <text x="100" y="112" fill="#F0EDE4" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700">Before you trust compact code context</text>
  <text x="100" y="158" fill="#AABCC5" font-family="Arial, Helvetica, sans-serif" font-size="25">Ask four short questions before you act on the result.</text>

  <g filter="url(#shadow)">
    <rect x="100" y="254" width="320" height="322" rx="24" fill="#102D3A" stroke="#35596A" stroke-width="2"/>
    <circle cx="158" cy="316" r="28" fill="#A9DDE7"/><text x="158" y="325" text-anchor="middle" fill="#08131E" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">1</text>
    <text x="204" y="325" fill="#F0EDE4" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Exact symbol</text>
    <line x1="148" y1="374" x2="372" y2="374" stroke="#35596A" stroke-width="2"/>
    <text x="148" y="428" fill="#C7D4D8" font-family="Arial, Helvetica, sans-serif" font-size="22">Right definition</text>
    <text x="148" y="460" fill="#C7D4D8" font-family="Arial, Helvetica, sans-serif" font-size="22">or overload?</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="460" y="254" width="320" height="322" rx="24" fill="#102D3A" stroke="#35596A" stroke-width="2"/>
    <circle cx="518" cy="316" r="28" fill="#A9DDE7"/><text x="518" y="325" text-anchor="middle" fill="#08131E" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">2</text>
    <text x="564" y="325" fill="#F0EDE4" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Right scope</text>
    <line x1="508" y1="374" x2="732" y2="374" stroke="#35596A" stroke-width="2"/>
    <text x="508" y="428" fill="#C7D4D8" font-family="Arial, Helvetica, sans-serif" font-size="22">Repo, module</text>
    <text x="508" y="460" fill="#C7D4D8" font-family="Arial, Helvetica, sans-serif" font-size="22">and build target?</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="820" y="254" width="320" height="322" rx="24" fill="#102D3A" stroke="#35596A" stroke-width="2"/>
    <circle cx="878" cy="316" r="28" fill="#A9DDE7"/><text x="878" y="325" text-anchor="middle" fill="#08131E" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">3</text>
    <text x="924" y="325" fill="#F0EDE4" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Tests split</text>
    <line x1="868" y1="374" x2="1092" y2="374" stroke="#35596A" stroke-width="2"/>
    <text x="868" y="428" fill="#C7D4D8" font-family="Arial, Helvetica, sans-serif" font-size="22">Keep production</text>
    <text x="868" y="460" fill="#C7D4D8" font-family="Arial, Helvetica, sans-serif" font-size="22">callers separate?</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1180" y="254" width="320" height="322" rx="24" fill="#2A2530" stroke="#F26B5B" stroke-width="2"/>
    <circle cx="1238" cy="316" r="28" fill="#F26B5B"/><text x="1238" y="325" text-anchor="middle" fill="#08131E" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">4</text>
    <text x="1284" y="325" fill="#F0EDE4" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Exact match</text>
    <line x1="1228" y1="374" x2="1452" y2="374" stroke="#704752" stroke-width="2"/>
    <text x="1228" y="428" fill="#C7D4D8" font-family="Arial, Helvetica, sans-serif" font-size="22">Approximate match</text>
    <text x="1228" y="460" fill="#C7D4D8" font-family="Arial, Helvetica, sans-serif" font-size="22">clearly disclosed?</text>
  </g>
  <rect x="100" y="672" width="1400" height="92" rx="18" fill="#0D202D" stroke="#A9DDE7" stroke-width="2"/>
  <text x="800" y="729" text-anchor="middle" fill="#F0EDE4" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">If any answer is unclear, verify it in source before acting.</text>
</svg>
