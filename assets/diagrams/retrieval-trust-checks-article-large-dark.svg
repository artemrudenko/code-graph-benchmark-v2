<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">Five checks before a compact answer guides a change</title>
  <desc id="desc">Check exact target, scope and build, test boundary, match type, and freshness. If one is unclear, verify current source before acting.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#A9DDE7"/></marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 62px; font-weight: 700; fill: #F0EDE4; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 400; fill: #B7C8D2; }
      .card-title { font-family: Arial, Helvetica, sans-serif; font-size: 38px; font-weight: 700; fill: #F0EDE4; }
      .card-body { font-family: Arial, Helvetica, sans-serif; font-size: 29px; font-weight: 400; fill: #B7C8D2; }
      .metric { font-family: Arial, Helvetica, sans-serif; font-size: 68px; font-weight: 700; fill: #F0EDE4; }
      .metric-small { font-family: Arial, Helvetica, sans-serif; font-size: 42px; font-weight: 700; fill: #F0EDE4; }
      .note { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #F0EDE4; }
      .small-note { font-family: Arial, Helvetica, sans-serif; font-size: 27px; font-weight: 700; fill: #08131E; }
      .box { stroke-width: 3; }
      .arrow { fill: none; stroke: #A9DDE7; stroke-width: 4; marker-end: url(#arrow); }
      .rule { stroke: #577581; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1600" height="640" fill="#08131E"/>
  <text x="80" y="78" class="title" text-anchor="start"><tspan x="80">Five checks before you act</tspan></text>
  <text x="80" y="122" class="subtitle" text-anchor="start"><tspan x="80">Use the index to navigate. Use current source and tests to decide.</tspan></text>
  <rect x="65" y="210" width="270" height="190" rx="18" fill="#102D3A" stroke="#A9DDE7" class="box"/>
  <circle cx="103" cy="248" r="20" fill="#A9DDE7"/>
  <text x="103" y="257" class="small-note" text-anchor="middle"><tspan x="103">1</tspan></text>
  <text x="95" y="320" class="card-title" text-anchor="start"><tspan x="95">Target</tspan></text>
  <text x="95" y="365" class="card-body" text-anchor="start"><tspan x="95">definition</tspan></text>
  <rect x="370" y="210" width="270" height="190" rx="18" fill="#102D3A" stroke="#A9DDE7" class="box"/>
  <circle cx="408" cy="248" r="20" fill="#A9DDE7"/>
  <text x="408" y="257" class="small-note" text-anchor="middle"><tspan x="408">2</tspan></text>
  <text x="400" y="320" class="card-title" text-anchor="start"><tspan x="400">Scope</tspan></text>
  <text x="400" y="365" class="card-body" text-anchor="start"><tspan x="400">root + build</tspan></text>
  <rect x="675" y="210" width="270" height="190" rx="18" fill="#102D3A" stroke="#A9DDE7" class="box"/>
  <circle cx="713" cy="248" r="20" fill="#A9DDE7"/>
  <text x="713" y="257" class="small-note" text-anchor="middle"><tspan x="713">3</tspan></text>
  <text x="705" y="320" class="card-title" text-anchor="start"><tspan x="705">Tests</tspan></text>
  <text x="705" y="365" class="card-body" text-anchor="start"><tspan x="705">prod / tests</tspan></text>
  <rect x="980" y="210" width="270" height="190" rx="18" fill="#332126" stroke="#F26B5B" class="box"/>
  <circle cx="1018" cy="248" r="20" fill="#F26B5B"/>
  <text x="1018" y="257" class="small-note" text-anchor="middle"><tspan x="1018">4</tspan></text>
  <text x="1010" y="320" class="card-title" text-anchor="start"><tspan x="1010">Match</tspan></text>
  <text x="1010" y="365" class="card-body" text-anchor="start"><tspan x="1010">exact / candidate</tspan></text>
  <rect x="1285" y="210" width="270" height="190" rx="18" fill="#332B1D" stroke="#F3C969" class="box"/>
  <circle cx="1323" cy="248" r="20" fill="#F3C969"/>
  <text x="1323" y="257" class="small-note" text-anchor="middle"><tspan x="1323">5</tspan></text>
  <text x="1315" y="320" class="card-title" text-anchor="start"><tspan x="1315">Freshness</tspan></text>
  <text x="1315" y="365" class="card-body" text-anchor="start"><tspan x="1315">revision matches</tspan></text>
  <rect x="65" y="485" width="1470" height="92" rx="16" fill="#153329" stroke="#62D2C3" class="box"/>
  <text x="800" y="543" class="note" text-anchor="middle"><tspan x="800">If one check is unclear, verify current source before acting.</tspan></text>
</svg>
