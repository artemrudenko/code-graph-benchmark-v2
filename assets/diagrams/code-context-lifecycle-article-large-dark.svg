<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">A safe loop for reusable code context</title>
  <desc id="desc">Four compact steps: set scope, build an index, navigate with it, then verify source and refresh.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#A9DDE7"/></marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 62px; font-weight: 700; fill: #F0EDE4; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 400; fill: #B7C8D2; }
      .card-title { font-family: Arial, Helvetica, sans-serif; font-size: 38px; font-weight: 700; fill: #F0EDE4; }
      .card-body { font-family: Arial, Helvetica, sans-serif; font-size: 29px; font-weight: 400; fill: #B7C8D2; }
      .metric { font-family: Arial, Helvetica, sans-serif; font-size: 68px; font-weight: 700; fill: #F0EDE4; }
      .metric-small { font-family: Arial, Helvetica, sans-serif; font-size: 42px; font-weight: 700; fill: #F0EDE4; }
      .note { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #F0EDE4; }
      .small-note { font-family: Arial, Helvetica, sans-serif; font-size: 27px; font-weight: 400; fill: #B7C8D2; }
      .box { stroke-width: 3; }
      .arrow { fill: none; stroke: #A9DDE7; stroke-width: 4; marker-end: url(#arrow); }
      .rule { stroke: #577581; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1600" height="640" fill="#08131E"/>
  <text x="80" y="78" class="title" text-anchor="start"><tspan x="80">A safe loop for reusable code context</tspan></text>
  <text x="80" y="122" class="subtitle" text-anchor="start"><tspan x="80">Build once. Verify before a decision. Refresh after a change.</tspan></text>
  <rect x="80" y="220" width="320" height="190" rx="18" fill="#102D3A" stroke="#A9DDE7" class="box"/>
  <text x="240" y="292" class="card-title" text-anchor="middle"><tspan x="240">Set scope</tspan></text>
  <text x="240" y="340" class="card-body" text-anchor="middle"><tspan x="240">repo root + build</tspan></text>
  <path d="M400 315 H475" class="arrow"/>
  <rect x="475" y="220" width="320" height="190" rx="18" fill="#102D3A" stroke="#A9DDE7" class="box"/>
  <text x="635" y="292" class="card-title" text-anchor="middle"><tspan x="635">Build index</tspan></text>
  <text x="635" y="340" class="card-body" text-anchor="middle"><tspan x="635">symbols + edges</tspan></text>
  <path d="M795 315 H870" class="arrow"/>
  <rect x="870" y="220" width="320" height="190" rx="18" fill="#332B1D" stroke="#F3C969" class="box"/>
  <text x="1030" y="292" class="card-title" text-anchor="middle"><tspan x="1030">Navigate</tspan></text>
  <text x="1030" y="340" class="card-body" text-anchor="middle"><tspan x="1030">callers, paths, tests</tspan></text>
  <path d="M1190 315 H1265" class="arrow"/>
  <rect x="1265" y="220" width="255" height="190" rx="18" fill="#153329" stroke="#62D2C3" class="box"/>
  <text x="1392" y="292" class="card-title" text-anchor="middle"><tspan x="1392">Verify</tspan></text>
  <text x="1392" y="340" class="card-body" text-anchor="middle"><tspan x="1392">source + refresh</tspan></text>
  <rect x="80" y="490" width="1440" height="92" rx="16" fill="#213039" stroke="#A9DDE7" class="box"/>
  <text x="800" y="549" class="note" text-anchor="middle"><tspan x="800">Working memory shortens repeated navigation. It does not replace source.</tspan></text>
</svg>
